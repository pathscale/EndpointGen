name: Publish

on:
  workflow_dispatch:
    inputs:
      crate:
        description: Crate to publish
        required: true
        type: choice
        options:
          - endpoint-gen
          - endpoint-gen-macros
          - both

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubicloud-standard-2
    steps:
      - name: Require master ref
        run: test "$GITHUB_REF" = refs/heads/master
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable

      # Checked before the upload rather than during it: an absent token
      # surfaces as an authentication error from `cargo publish` after the
      # package is built, which reads like a registry problem.
      - run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is empty. Set it on pathscale/EndpointGen:"
            echo "  gh secret set CARGO_REGISTRY_TOKEN --repo pathscale/EndpointGen"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish endpoint-gen-macros
        if: inputs.crate == 'endpoint-gen-macros' || inputs.crate == 'both'
        run: cargo publish --registry crates-io --manifest-path endpoint-gen-macros/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish endpoint-gen
        if: inputs.crate == 'endpoint-gen' || inputs.crate == 'both'
        run: cargo publish --registry crates-io --manifest-path Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
