name: Publish

# House scheme, as nago-wss: a version bump on the default branch is the
# release. No tags, no manual step. Publishing is irreversible, so the trigger
# has to be something you cannot do by accident, and editing the version field
# is that.
#
# Two crates: endpoint-gen-macros is published first, because endpoint-gen
# depends on it by version. Each is checked and published on its own.
on:
  push:
    branches: [master]
    paths: ['Cargo.toml', 'endpoint-gen-macros/Cargo.toml']
  # A release that was merged before this gate was fixed has no Cargo.toml
  # change left to make, so it cannot be triggered by the push rule alone.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Checked before the upload rather than during it: an absent token
      # surfaces as an authentication error from `cargo publish` after the
      # package is built, which reads like a registry problem.
      - run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is empty. Set it on pathscale/EndpointGen:"
            echo "  gh secret set CARGO_REGISTRY_TOKEN --repo pathscale/EndpointGen"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - run: cargo test --release

      # The registry is the only authority on what is already released.
      - name: Publish each crate whose version is not on crates.io
        run: |
          set -eu
          for manifest in endpoint-gen-macros/Cargo.toml Cargo.toml; do
            name=$(cargo read-manifest --manifest-path "$manifest" | jq -er '.name')
            version=$(cargo read-manifest --manifest-path "$manifest" | jq -er '.version')
            if cargo info --registry crates-io "$name@$version" >/dev/null 2>&1; then
              echo "$name $version is already on crates.io, nothing to publish"
            else
              echo "$name $version is not on crates.io, publishing"
              cargo publish --manifest-path "$manifest" --token "$CARGO_REGISTRY_TOKEN"
            fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
